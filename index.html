<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gowrishankar S | AI & ML Engineer</title>
    <meta name="description" content="Portfolio of Gowrishankar S, AI & Machine Learning Engineer specializing in Computer Vision, Deep Learning, and Edge AI. based in Coimbatore, Tamil Nadu.">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .title-container {
            margin-bottom: 2rem;
        }

        .hero-title {
            margin-bottom: 0.5rem;
        }

        .typewriter-container {
            font-size: 1.5rem;
            color: var(--accent-blue);
            font-family: var(--font-display);
            height: 40px;
            font-weight: 600;
        }

        .hero-tagline {
            max-width: 600px;
            margin: 0 auto 3rem;
            font-size: 1.25rem;
            color: var(--text-body);
        }

        .cta-container {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .floating-badge {
            position: absolute;
            top: 100px;
            right: 5%;
            animation: float 4s ease-in-out infinite;
        }

        .location-tag {
            position: absolute;
            bottom: 40px;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-display);
            font-weight: 600;
            opacity: 0.7;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
        }

        .scroll-down svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-heading);
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        /* Typewriter Cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background-color: var(--accent-blue);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="loader-text">GOWRISHANKAR S</div>
    </div>

    <nav class="navbar">
        <a href="index.html" class="logo">GS<span style="color:var(--accent-blue)">.</span></a>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="projects.html">Projects</a>
            <a href="experience.html">Experience</a>
            <a href="contact.html">Contact</a>
            <div class="nav-underline"></div>
        </div>
        <button class="hamburger">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="contact.html">Contact</a>
    </div>

    <main>
        <section class="hero reveal">
            <div class="badge floating-badge">
                <div class="dot"></div>
                ⚡ Open to Opportunities
            </div>
            
            <div class="title-container relative z-10">
                <h1 class="hero-title reveal-text">GOWRISHANKAR S</h1>
                <div class="typewriter-container">
                    <span id="typewriter-text"></span><span class="cursor"></span>
                </div>
            </div>

            <p class="hero-tagline reveal" style="transition-delay: 0.4s;">
                Building intelligent systems that see, learn, and act — from edge devices to the cloud.
            </p>

            <div class="cta-container reveal" style="transition-delay: 0.6s;">
                <a href="projects.html" class="btn btn-primary">View My Work</a>
                <a href="Gowrishankar.pdf" target="_blank" class="btn btn-ghost">Download Resume</a>
            </div>

            <div class="location-tag reveal" style="transition-delay: 0.8s;">
                📍 Coimbatore, Tamil Nadu
            </div>

            <div class="scroll-down reveal" style="transition-delay: 1s;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </section>
    </main>

    <script src="shared.js"></script>
    <script>
        // Typewriter Effect
        const roles = [
            "AI & ML Engineer",
            "Computer Vision Specialist",
            "Deep Learning Developer",
            "Edge AI Builder"
        ];
        
        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let textElement = document.getElementById('typewriter-text');

        function typeWriter() {
            const currentRole = roles[roleIndex];
            
            if (isDeleting) {
                textElement.textContent = currentRole.substring(0, charIndex - 1);
                charIndex--;
            } else {
                textElement.textContent = currentRole.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentRole.length) {
                typeSpeed = 2000; // Pause at end
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                roleIndex = (roleIndex + 1) % roles.length;
                typeSpeed = 500; // Pause before new word
            }

            setTimeout(typeWriter, typeSpeed);
        }

        setTimeout(typeWriter, 2000); // Start after loader
    </script>
</body>
</html>
