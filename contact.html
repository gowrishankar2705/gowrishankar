<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gowrishankar S</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            padding: 4rem 5% 6rem;
            min-height: calc(100vh - var(--nav-height));
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 3rem;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
        }

        .contact-header h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .contact-subtitle {
            font-size: 1.2rem;
            color: var(--text-body);
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .social-links {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2rem;
            width: 100%;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: var(--text-heading);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 1.1rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .social-link .icon {
            font-size: 1.5rem;
            z-index: 2;
        }

        .social-link .label {
            z-index: 2;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255,255,255,0.02);
            transform: translateX(-100%);
            transition: transform 0.45s cubic-bezier(0.2,0.8,0.2,1);
            z-index: 1;
        }

        .social-link:hover::before {
            transform: translateX(100%);
        }

        .social-link.email:hover { border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(-3px); }
        .social-link.linkedin:hover { border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(-3px); }
        .social-link.github:hover { border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(-3px); }

        @media (max-width: 768px) {
            .social-links {
                flex-direction: column;
                align-items: stretch;
            }
            .social-link {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">GS<span>.</span></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="projects.html">Projects</a>
            <a href="experience.html">Experience</a>
            <a href="contact.html" class="active">Contact</a>
            <div class="nav-underline"></div>
        </div>
        <button class="hamburger">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="mobile-menu">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="contact.html">Contact</a>
    </div>

    <main>
        <section class="contact-section">
            <div class="contact-container">
                <div class="contact-info">
                    <div class="contact-header">
                        <h1 class="reveal-text">Let's Build Something Intelligent.</h1>
                        <p class="contact-subtitle reveal" style="transition-delay: 0.2s;">
                            Whether it's a product, a collab, or just a conversation about AI — I'm in.
                        </p>
                    </div>

                    <div class="social-links reveal" style="transition-delay: 0.4s;">
                        <a href="mailto:gowrishankars27@outlook.com" class="social-link email tilt-card">
                            <span class="icon">📧</span>
                            <span class="label">gowrishankars27@outlook.com</span>
                        </a>
                        <a href="https://www.linkedin.com/in/gowrishankar-s-59a782253/" class="social-link linkedin tilt-card">
                            <span class="icon">💼</span>
                            <span class="label">LinkedIn Profile</span>
                        </a>
                        <a href="https://github.com/gowrishankar2705" class="social-link github tilt-card">
                            <span class="icon">🐙</span>
                            <span class="label">GitHub Profile</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>


    </main>

    <script src="shared.js"></script>
</body>
</html>
