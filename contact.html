<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Gowrishankar S</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <style>
                    :root {
      --bg-dark: #0f172a;
      --surface: #1e293b;
      --card: #1e293b;
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --glow: rgba(59, 130, 246, 0.4);
      --cyan: #06b6d4;
      --gold: #f59e0b;
      --white: #f8fafc;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --font-disp: 'Inter', sans-serif;
      --font-head: 'Inter', sans-serif;
      --font-body: 'JetBrains Mono', monospace;
    }

    * { margin:0; padding:0; box-sizing:border-box; cursor: crosshair; } a, button, .interactive, input, textarea, .story-card, .val-panel, .thumb { cursor: pointer; }
    body { background: var(--bg-dark); background-image: radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08), transparent 40%), radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08), transparent 40%); color: var(--text); font-family: var(--font-body); overflow-x: hidden; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9998; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 1px, rgba(255,255,255,0.02) 1px, rgba(255,255,255,0.02) 2px); }
    #bg-canvas { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
    .bg-radial { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 60%); z-index: -1; pointer-events: none; }

    
    .cursor-ring { width: 36px; height: 36px; border: 1px solid var(--primary); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background 0.2s; }
    .click-pulse { position: fixed; width: 20px; height: 20px; border: 2px solid var(--cyan); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10000; animation: clickExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes clickExpand { 0% { width: 20px; height: 20px; opacity: 1; border-width: 2px; } 100% { width: 80px; height: 80px; opacity: 0; border-width: 0px; box-shadow: 0 0 20px var(--primary); } }
    .cursor-ring.active { width: 60px; height: 60px; background: rgba(59, 130, 246, 0.15); border-color: var(--cyan); box-shadow: 0 0 15px var(--primary); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    

    .glitch-overlay { position: fixed; inset: 0; z-index: 99999; pointer-events: none; display: flex; flex-direction: column; }
    .glitch-bar { flex: 1; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(20px); transform: scaleX(0); transform-origin: left; }
    .glitch-overlay.active .glitch-bar:nth-child(1) { animation: glitchSweep 0.5s ease-in-out forwards; background: var(--primary); }
    .glitch-overlay.active .glitch-bar:nth-child(2) { animation: glitchSweep 0.5s ease-in-out 0.1s forwards; background: var(--cyan); }
    .glitch-overlay.active .glitch-bar:nth-child(3) { animation: glitchSweep 0.5s ease-in-out 0.2s forwards; background: var(--gold); }
    @keyframes glitchSweep { 
      0% { transform: scaleX(0) skewX(-15deg); transform-origin: left; filter: blur(10px); } 
      40% { transform: scaleX(1.05) skewX(0deg); transform-origin: left; filter: blur(0px); } 
      50% { transform: scaleX(1) skewX(0deg); transform-origin: left; } 
      51% { transform: scaleX(1) skewX(0deg); transform-origin: right; } 
      100% { transform: scaleX(0) skewX(15deg); transform-origin: right; filter: blur(10px); } 
    }

    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 60px; background: rgba(11, 15, 25, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-right: 1px solid rgba(59, 130, 246, 0.2); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 9000; }
    .nav-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); text-decoration: none; margin-bottom: 12px; transition: all 0.3s; position: relative; }
    .nav-btn:hover { color: var(--primary); box-shadow: 0 0 20px var(--glow); background: rgba(59, 130, 246, 0.1); }
    .nav-btn.active { color: var(--primary); }
    .nav-btn.active::after { content: ''; position: absolute; inset: -4px; border: 1px solid var(--primary); border-radius: 50%; animation: pulseRing 2s infinite; }
    @keyframes pulseRing { 0% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 100% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 20px 10px rgba(59, 130, 246, 0); } }
    .side-logo { margin-top: auto; font-family: var(--font-disp); color: var(--gold); font-size: 14px; font-weight: 700; text-decoration: none; }

    .main-content { margin-left: 60px; min-height: 100vh; position: relative; animation: slideInPage 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes slideInPage { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

    .reveal { opacity: 0; transform: translateY(40px) scale(0.98); filter: blur(4px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }

    /* CONTACT SPECIFIC */
    .contact-sec { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 0 5%; gap: 5%; }
    .contact-left { flex: 0 0 50%; max-width: 600px; }

    .sys-label { font-family: var(--font-body); font-size: 13px; color: var(--cyan); margin-bottom: 24px; display: inline-block; }

    .giant-links { display: flex; flex-direction: column; }
    .g-link { font-family: var(--font-disp); font-size: clamp(40px, 5vw, 72px); font-weight: 700; color: transparent; -webkit-text-stroke: 1.5px var(--muted); text-decoration: none; padding: 20px 0; border-bottom: 1px solid var(--border); transition: color 0.3s, padding 0.3s, border 0.3s, text-shadow 0.3s, transform 0.15s cubic-bezier(0.2,0.8,0.2,1); position: relative; overflow: hidden; display: block; line-height: 1.1; }
    .g-link:first-child { border-top: 1px solid var(--border); }
    .g-link:hover { color: var(--white); -webkit-text-stroke: 0px; text-shadow: 0 0 20px var(--glow); font-style: italic; padding-left: 40px; border-color: var(--primary); }
    .g-link::before { content: '>'; position: absolute; left: 0; opacity: 0; color: var(--primary); transition: 0.3s; font-style: normal; }
    .g-link:hover::before { opacity: 1; left: 0; }



    @media (max-width: 900px) {
      .sidebar { top: auto; bottom: 0; width: 100%; height: 60px; border-right: none; border-top: 1px solid rgba(59, 130, 246, 0.2); flex-direction: row; justify-content: space-around; padding: 0; }
      .nav-btn { margin-bottom: 0; }
      .side-logo { display: none; }
      .main-content { margin-left: 0; margin-bottom: 60px; padding-bottom: 0px; }
      .cursor-dot, .cursor-ring { width: 36px; height: 36px; border: 1px solid var(--primary); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, background 0.2s; }
    .click-pulse { position: fixed; width: 20px; height: 20px; border: 2px solid var(--cyan); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10000; animation: clickExpand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes clickExpand { 0% { width: 20px; height: 20px; opacity: 1; border-width: 2px; } 100% { width: 80px; height: 80px; opacity: 0; border-width: 0px; box-shadow: 0 0 20px var(--primary); } }
      * { cursor: auto !important; }

      .contact-sec { flex-direction: column; gap: 60px; padding: 100px 5% 60px 5%; justify-content: center; }
      .contact-left { flex: auto; width: 100%; }
      .sys-label { text-align: center; width: 100%; }
      .g-link { font-size: 40px; text-align: center; }
      .g-link:hover { padding-left: 0; }
      .g-link::before { display: none; }
    }
  </style>
</head>
<body>

  <div class="glitch-overlay"><div class="glitch-bar"></div><div class="glitch-bar"></div><div class="glitch-bar"></div></div>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-radial"></div>
  <div class="scanlines"></div>
  
  <div class="cursor-ring"></div>

  <!-- Sidebar -->
  <nav class="sidebar">
    <a href="index.html" class="nav-btn interactive" title="Home"><i class="fa-solid fa-house"></i></a>
    <a href="about.html" class="nav-btn interactive" title="About"><i class="fa-solid fa-user"></i></a>
    <a href="skills.html" class="nav-btn interactive" title="Skills"><i class="fa-solid fa-bolt"></i></a>
    <a href="projects.html" class="nav-btn interactive" title="Projects"><i class="fa-solid fa-folder-open"></i></a>

    <a href="contact.html" class="nav-btn active interactive" title="Contact"><i class="fa-solid fa-envelope"></i></a>
    <a href="#" class="side-logo interactive">GS</a>
  </nav>

  <main class="main-content">
    
    <section class="contact-sec">
      <div class="contact-left reveal">
        <div class="sys-label">> INITIATING_HANDSHAKE</div>
        <div class="giant-links">
          <a href="mailto:gowrishankars27@outlook.com" class="g-link interactive">EMAIL</a>
          <a href="https://www.linkedin.com/in/gowrishankar-s-59a782253/" target="_blank" class="g-link interactive">LINKEDIN</a>
          <a href="https://github.com/gowrishankar2705" target="_blank" class="g-link interactive">GITHUB</a>
          <a href="Gowrishankar.pdf" download class="g-link interactive">RESUME</a>
          
        </div>
      </div>

    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

            // Cursor & Click Pulse
      const ring = document.querySelector('.cursor-ring');
      if (window.matchMedia("(pointer: fine)").matches && ring) {
        let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
        let ringX = mouseX, ringY = mouseY;
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        function loop() {
          ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15;
          ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        document.querySelectorAll('a, button, input, textarea, .interactive, .thumb, .story-card, .val-panel').forEach(el => {
          el.addEventListener('mouseenter', () => ring.classList.add('active'));
          el.addEventListener('mouseleave', () => ring.classList.remove('active'));
        });
        
        window.addEventListener('click', e => {
            const p = document.createElement('div');
            p.classList.add('click-pulse');
            p.style.left = e.clientX + 'px';
            p.style.top = e.clientY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 600);
        });
      }


      // Glitch Nav
      document.querySelectorAll('a').forEach(link => {
        if(link.hostname === window.location.hostname && link.target !== '_blank' && !link.hasAttribute('download') && link.getAttribute('href') !== '#' && !link.getAttribute('href').startsWith('mailto:')) {
          link.addEventListener('click', e => {
            e.preventDefault();
            const href = link.href;
            document.querySelector('.glitch-overlay').classList.add('active');
            setTimeout(() => window.location.href = href, 400);
          });
        }
      });

      


      document.querySelectorAll('.g-link').forEach(link => {
        link.addEventListener('mousemove', e => {
          const rect = link.getBoundingClientRect();
          const x = (e.clientX - rect.left) - rect.width/2;
          const y = (e.clientY - rect.top) - rect.height/2;
          link.style.transform = `translate(${x * 0.25}px, ${y * 0.25}px) scale(1.05)`;
          link.style.color = '#fff';
          link.style.textShadow = '0 0 30px var(--glow)';
        });
        link.addEventListener('mouseleave', () => {
          link.style.transform = `translate(0px, 0px) scale(1)`;
          link.style.color = 'transparent';
          link.style.textShadow = 'none';
        });
      });
      
      // Background Canvas
      const bgCanvas = document.getElementById('bg-canvas');
      if(bgCanvas) {
        const bgCtx = bgCanvas.getContext('2d');
        let bgW = bgCanvas.width = window.innerWidth;
        let bgH = bgCanvas.height = window.innerHeight;
        window.addEventListener('resize', () => { bgW = bgCanvas.width = window.innerWidth; bgH = bgCanvas.height = window.innerHeight; });
        const bgParticles = [];
        for(let i=0; i<80; i++) bgParticles.push({ x: Math.random()*bgW, y: Math.random()*bgH, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5 });
        function drawBg() {
          bgCtx.clearRect(0,0,bgW,bgH);
          bgCtx.fillStyle = 'rgba(59, 130, 246, 0.2)';
          bgParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0||p.x>bgW) p.vx*=-1; if(p.y<0||p.y>bgH) p.vy*=-1;
            bgCtx.beginPath(); bgCtx.arc(p.x, p.y, 1.5, 0, Math.PI*2); bgCtx.fill();
          });
          bgCtx.strokeStyle = 'rgba(6, 182, 212, 0.08)';
          for(let i=0; i<bgParticles.length; i++) {
            for(let j=i+1; j<bgParticles.length; j++) {
              let dx = bgParticles[i].x - bgParticles[j].x, dy = bgParticles[i].y - bgParticles[j].y;
              if(dx*dx + dy*dy < 15000) {
                bgCtx.beginPath(); bgCtx.moveTo(bgParticles[i].x, bgParticles[i].y); bgCtx.lineTo(bgParticles[j].x, bgParticles[j].y); bgCtx.stroke();
              }
            }
          }
          requestAnimationFrame(drawBg);
        }
        drawBg();
      }

      // Intersection Observer for reveals
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); } });
      }, {threshold: 0.15, rootMargin: '0px 0px -50px 0px'});
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    });
    

  </script>
</body>
